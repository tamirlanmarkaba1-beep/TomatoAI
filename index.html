<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TomatoAI — Custom LLM</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.14.0/dist/ort.min.js"></script>
</head>
<body class="bg-gray-900 text-white font-sans h-screen flex flex-col justify-center items-center p-4">

  <div class="w-full max-w-lg bg-gray-800 rounded-2xl p-6 shadow-2xl border border-gray-700">
    <div class="flex items-center space-x-3 mb-4">
      <span class="text-3xl">🍅</span>
      <div>
        <h1 class="text-xl font-bold bg-gradient-to-r from-red-500 to-orange-500 bg-clip-text text-transparent">TomatoAI Custom LLM</h1>
        <p id="status" class="text-xs text-yellow-400">⏳ Загрузка...</p>
      </div>
    </div>

    <div id="output" class="w-full h-48 bg-gray-950 rounded-xl p-4 text-sm font-mono overflow-y-auto mb-4 border border-gray-800 leading-relaxed">
      <span class="text-gray-500">Здесь появится ответ твоей нейросети...</span>
    </div>

    <div class="flex space-x-2">
      <input type="text" id="userInput" placeholder="Начни писать: Привет" value="Привет" class="flex-1 bg-gray-700 border border-gray-600 rounded-xl px-4 py-2.5 text-sm outline-none focus:border-red-500">
      <button id="btnGenerate" disabled onclick="generateText()" class="bg-red-600 hover:bg-red-500 font-medium px-5 py-2.5 rounded-xl text-sm transition opacity-50">
        Сгенерировать
      </button>
    </div>
  </div>

  <script>
    let session = null;
    let stoi = {};
    let itos = {};
    const blockSize = 16;

    async function init() {
      const status = document.getElementById('status');
      const btn = document.getElementById('btnGenerate');

      try {
        status.textContent = "⏳ Чтение vocab.json...";
        const vocabRes = await fetch('./vocab.json');
        const vocabData = await vocabRes.json();
        stoi = vocabData.stoi;
        itos = vocabData.itos;

        status.textContent = "⏳ Загрузка TomatoAI.onnx...";
        const modelRes = await fetch('./TomatoAI.onnx');
        const buffer = await modelRes.arrayBuffer();

        status.textContent = "⏳ Запуск сессии...";
        session = await ort.InferenceSession.create(buffer);

        status.textContent = "✅ Модель готова!";
        status.className = "text-xs text-green-400 font-bold";
        btn.disabled = false;
        btn.classList.remove('opacity-50');
      } catch (err) {
        console.error(err);
        status.textContent = "❌ Ошибка: " + (err.message || err);
        status.className = "text-xs text-red-400 font-bold";
      }
    }

    async function generateText() {
      const inputEl = document.getElementById('userInput');
      const outputEl = document.getElementById('output');
      const text = inputEl.value.trim();

      if (!text || !session) return;

      let tokens = text.split('').map(ch => stoi[ch] !== undefined ? stoi[ch] : 0);
      outputEl.innerHTML = `<b class="text-red-400">${text}</b>`;

      for (let i = 0; i < 40; i++) {
        const context = tokens.slice(-blockSize);
        const bigIntData = new BigInt64Array(context.map(x => BigInt(x)));
        const inputTensor = new ort.Tensor('int64', bigIntData, [1, context.length]);

        const results = await session.run({ input: inputTensor });
        const logits = results.output.data;

        const vocabSize = Object.keys(itos).length;
        const lastLogits = logits.slice(-vocabSize);

        let maxIdx = 0;
        let maxVal = -Infinity;
        for (let j = 0; j < lastLogits.length; j++) {
          if (lastLogits[j] > maxVal) {
            maxVal = lastLogits[j];
            maxIdx = j;
          }
        }

        tokens.push(maxIdx);
        const nextChar = itos[maxIdx] || '';
        outputEl.innerHTML += nextChar;

        await new Promise(r => setTimeout(r, 30));
      }
    }

    init();
  </script>
</body>
</html>
