<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TomatoAI — Custom LLM</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white font-sans h-screen flex flex-col justify-center items-center p-4">

  <div class="w-full max-w-lg bg-gray-800 rounded-2xl p-6 shadow-2xl border border-gray-700">
    <div class="flex items-center space-x-3 mb-4">
      <span class="text-3xl">🍅</span>
      <div>
        <h1 class="text-xl font-bold bg-gradient-to-r from-red-500 to-orange-500 bg-clip-text text-transparent">TomatoAI Custom LLM</h1>
        <p id="status" class="text-xs text-yellow-400">⏳ Загрузка модели...</p>
      </div>
    </div>

    <div id="output" class="w-full h-48 bg-gray-950 rounded-xl p-4 text-sm font-mono overflow-y-auto mb-4 border border-gray-800 leading-relaxed">
      <span class="text-gray-500">Здесь появится ответ твоей нейросети...</span>
    </div>

    <div class="flex space-x-2">
      <input type="text" id="userInput" placeholder="Начни писать: Привет" value="Привет" class="flex-1 bg-gray-700 border border-gray-600 rounded-xl px-4 py-2.5 text-sm outline-none focus:border-red-500">
      <button id="btnGenerate" disabled onclick="generateText()" class="bg-red-600 hover:bg-red-500 font-medium px-5 py-2.5 rounded-xl text-sm transition opacity-50">
        Сгенерировать
      </button>
    </div>
  </div>

  <script>
    let model = null;

    async function init() {
      const status = document.getElementById('status');
      const btn = document.getElementById('btnGenerate');

      try {
        const res = await fetch('./model.json?v=' + Date.now());
        if (!res.ok) throw new Error("Файл model.json не найден!");
        model = await res.json();

        status.textContent = "✅ Модель готова!";
        status.className = "text-xs text-green-400 font-bold";
        btn.disabled = false;
        btn.classList.remove('opacity-50');
      } catch (err) {
        console.error(err);
        status.textContent = "❌ " + err.message;
        status.className = "text-xs text-red-400 font-bold";
      }
    }

    function forward(tokens) {
      const { emb, fc_w, fc_b, block_size } = model;
      
      let context = tokens.slice(-block_size);
      while (context.length < block_size) {
        context.unshift(0);
      }

      let x = [];
      for (let t of context) {
        x.push(...(emb[t] || emb[0]));
      }

      let logits = [...fc_b];
      for (let i = 0; i < fc_w.length; i++) {
        let row = fc_w[i];
        for (let j = 0; j < x.length; j++) {
          logits[i] += row[j] * x[j];
        }
      }

      return logits;
    }

    // Расчет Softmax с учетом температуры
    function softmax(arr, temperature = 0.5) {
      const logits = arr.map(v => v / temperature);
      const maxLogit = Math.max(...logits);
      const exps = logits.map(v => Math.exp(v - maxLogit));
      const sumExps = exps.reduce((a, b) => a + b, 0);
      return exps.map(v => v / sumExps);
    }

    // Сэмплирование на основе вероятностей
    function sampleFromProbs(probs) {
      const r = Math.random();
      let acc = 0;
      for (let i = 0; i < probs.length; i++) {
        acc += probs[i];
        if (r <= acc) return i;
      }
      return probs.length - 1;
    }

    async function generateText() {
      const inputEl = document.getElementById('userInput');
      const outputEl = document.getElementById('output');
      const text = inputEl.value;

      if (!text || !model) return;

      let tokens = text.split('').map(ch => model.stoi[ch] !== undefined ? model.stoi[ch] : 0);
      outputEl.innerHTML = `<b class="text-red-400">${text}</b>`;

      for (let i = 0; i < 60; i++) {
        const logits = forward(tokens);
        const probs = softmax(logits, 0.4); // Температура (чем меньше, тем точнее слова)
        const nextIdx = sampleFromProbs(probs);

        tokens.push(nextIdx);
        const nextChar = model.itos[nextIdx] || '';
        outputEl.innerHTML += nextChar;

        await new Promise(r => setTimeout(r, 20));
      }
    }

    init();
  </script>
</body>
</html>
