
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

import {
  getDatabase,
  ref,
  push,
  onValue,
  query,
  orderByChild,
  limitToLast
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDHzkpc_3kAA6jQE3wgnwJBhrUh_TV2HHI",
  authDomain: "tomatocodebase.firebaseapp.com",
  databaseURL: "https://tomatocodebase-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "tomatocodebase",
  storageBucket: "tomatocodebase.firebasestorage.app",
  messagingSenderId: "937663065021",
  appId: "1:937663065021:web:01308ac7c031de565680d4",
  measurementId: "G-CF36XR1Y8H"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const commentsRef = ref(db, "comments");
const commentsList = document.getElementById("comments-list");
const form = document.getElementById("form");

const commentsQuery = query(
  commentsRef,
  orderByChild("createdAt"),
  limitToLast(100)
);

// Отображение комментариев в реальном времени
onValue(commentsQuery, snapshot => {
  commentsList.innerHTML = "";

  if (!snapshot.exists()) {
    commentsList.textContent = "Пока комментариев нет. Будь первым!";
    return;
  }

  const comments = [];
  snapshot.forEach(child => {
    comments.push(child.val());
  });

  comments.reverse().forEach(item => {
    const card = document.createElement("div");
    card.className = "comment";

    const name = document.createElement("b");
    name.textContent = item.name;

    const message = document.createElement("p");
    message.textContent = item.message;

    const date = document.createElement("small");
    date.textContent = new Date(item.createdAt).toLocaleString("ru-RU");

    card.append(name, message, date);
    commentsList.append(card);
  });
}, error => {
  console.error(error);
  commentsList.textContent = "Не удалось загрузить комментарии.";
});

// Отправка комментария
form.addEventListener("submit", async event => {
  event.preventDefault();

  const name = document.getElementById("name").value.trim();
  const message = document.getElementById("message").value.trim();

  if (!name || !message) return;

  const button = form.querySelector("button");
  button.disabled = true;

  try {
    await push(commentsRef, {
      name: name.slice(0, 32),
      message: message.slice(0, 500),
      createdAt: Date.now()
    });

    form.reset();
    alert("Комментарий опубликован!");

  } catch (error) {
    console.error(error);
    alert("Ошибка отправки. Проверь настройки Firebase.");
  } finally {
    button.disabled = false;
  }
});
</script>
